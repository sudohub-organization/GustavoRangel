<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gustavo Rangel - Rocket Dodger</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="smallscreens.css">
</head>
<body class="text-slate-200">
    <div id="canvas-container" aria-hidden="true"></div>

    <div id="ui-layer">
        <a id="back-to-portfolio" href="../index.html" class="fixed top-4 left-4 inline-flex items-center gap-2 glass-panel px-4 py-3 rounded-full text-sm font-semibold text-white border border-slate-700 shadow-[0_0_20px_rgba(15,23,42,0.35)] pointer-events-auto z-30 hover:border-pink-400 hover:text-pink-200 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4" aria-hidden="true"></i>
            <span>Back to Portfolio</span>
        </a>

        <div id="timer-hud" class="fixed top-4 left-1/2 -translate-x-1/2 glass-panel px-5 py-3 rounded-full z-30 text-center pointer-events-none">
            <p class="timer-label">Survival Time</p>
            <p id="timer-value" class="timer-value">00:00</p>
        </div>

        <div id="speed-hud" class="fixed top-4 right-4 glass-panel px-4 py-3 rounded-xl z-30 text-right pointer-events-none">
            <p class="timer-label">Speed</p>
            <p id="speed-value" class="speed-value">1.0x</p>
        </div>

        <div id="instructions" class="fixed bottom-8 left-1/2 -translate-x-1/2 glass-panel px-6 py-4 rounded-xl text-sm hide-on-mobile flex items-center gap-6 shadow-[0_0_30px_rgba(244,114,182,0.2)] border-t-2 border-pink-500 pointer-events-auto z-30">
            <div>
                <p><span class="font-bold text-pink-400">WASD</span> or <span class="font-bold text-pink-400">Arrows</span> to dodge.</p>
                <p>Survive as long as you can.</p>
            </div>
            <button type="button" id="dismiss-instructions" class="text-slate-400 hover:text-white bg-slate-800/50 rounded-full p-2 transition-colors" aria-label="Hide instructions">
                <i data-lucide="x" class="w-4 h-4" aria-hidden="true"></i>
            </button>
        </div>

        <div id="mobile-hint" class="absolute bottom-4 right-4 glass-panel px-4 py-2 rounded-lg text-sm md:hidden pointer-events-none z-30">
            Drag joystick to dodge
        </div>

        <div id="joystick-zone"></div>

        <div id="loss-backdrop" class="hidden fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-40 pointer-events-auto"></div>

        <div id="loss-modal" class="hidden fixed left-1/2 top-1/2 w-[min(92vw,760px)] max-h-[90vh] -translate-x-1/2 -translate-y-1/2 overflow-y-auto glass-panel loss-panel p-5 md:p-8 z-50 pointer-events-auto" role="dialog" aria-modal="true" aria-labelledby="loss-title" aria-hidden="true">
            <div class="loss-header">
                <div>
                    <p class="timer-label">Final Score</p>
                    <h1 id="loss-title" class="loss-title">You lasted <span id="final-score">00:00</span></h1>
                </div>
                <button type="button" id="restart-game" class="restart-btn">Restart</button>
            </div>
            <p class="loss-copy">Message me your score and I will know you survived the rocket dodger.</p>
            <div id="score-contact-container" class="score-contact-container" aria-live="polite"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
