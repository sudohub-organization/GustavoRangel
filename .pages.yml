media:
  input: public/images
  output: /public/images

content:
  - name: site
    label: Site content
    type: file
    path: public/data/site.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - { name: copy, label: Copy, type: text }
          - { name: image, label: Portrait image, type: image }
          - { name: imageAlt, label: Portrait alt text, type: string }
          - name: actions
            label: Hero actions
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
              - { name: style, label: Style, type: string }
          - name: socialLinks
            label: Social links
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: URL, type: string }
              - { name: icon, label: Icon, type: string }
              - { name: variant, label: Variant, type: string, required: false }
      - name: projects
        label: Projects section heading
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
      - name: skills
        label: Skills
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - name: items
            label: Skill groups
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: description, label: Description, type: text }
              - name: technologies
                label: Technologies
                type: string
                list: true
      - name: blog
        label: Blog section heading
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
      - name: experience
        label: Experience
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - name: items
            label: Timeline items
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: company, label: Company, type: string }
              - { name: date, label: Date label, type: string }
              - { name: description, label: Description, type: text }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: footer, label: Footer text, type: string }

  - name: projects
    label: Projects
    type: file
    path: public/data/projects.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string }
      - { name: summary, label: Summary, type: text }
      - { name: role, label: Role, type: string }
      - name: stack
        label: Stack
        type: string
        list: true
      - { name: year, label: Year, type: string }
      - name: links
        label: Links
        type: object
        fields:
          - { name: live, label: Live URL, type: string, required: false }
          - { name: repo, label: Repository URL, type: string, required: false }
          - { name: caseStudy, label: Case study URL, type: string, required: false }
      - { name: featured, label: Featured, type: boolean }

  - name: blog
    label: Blog posts
    type: file
    path: public/data/blog.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string }
      - { name: date, label: Date, type: date }
      - { name: excerpt, label: Excerpt, type: text }
      - { name: body, label: Body (Markdown), type: text }
      - { name: published, label: Published, type: boolean }
      - { name: coverImage, label: Cover image, type: image, required: false }
      - name: tags
        label: Tags
        type: string
        list: true
